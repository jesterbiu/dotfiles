# Herdr-style pane controls
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# v: side-by-side panes; -: stacked panes
bind v split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Move between panes with Vim-style keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Move between windows and choose a session
bind n next-window
bind p previous-window
bind s choose-tree -s

# Prompt for a name and create/switch to a new session
bind N command-prompt -p 'New session name' "new-session -s '%%'"

# Mouse: focus panes, resize borders, select windows, and scroll history
set -g mouse on

# Vi-style copy mode; y and mouse selection copy to the system clipboard
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'

# Advertise Ghostty's extended-key support.
set -as terminal-features ',xterm-ghostty:extkeys'

# Allow applications to request distinct modified keys.
set -s extended-keys on
set -s extended-keys-format csi-u

set -g focus-events on

# Let panes reach the Wayland clipboard; the systemd-started server lacks these.
set -ga update-environment ' WAYLAND_DISPLAY XDG_SESSION_TYPE XDG_CURRENT_DESKTOP'

# This server is owned by tmux-work.service, not the desktop session.
set -s exit-empty off
set -g @resurrect-dir '~/.local/state/tmux-work/resurrect'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
# systemd manages startup; do not let continuum install another service.
set -g @continuum-boot 'off'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
run '~/.tmux/plugins/tpm/tpm'
